<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>設定 | Windows CMD</title>
  <link rel="stylesheet" href="../css/style.css?v=17" />
</head>
<body>
  <div class="placeholder-shell">
    <header class="placeholder-topbar"><a class="placeholder-back" href="../" data-i18n="back">← CMD編に戻る</a><h1>Windows CMD</h1></header>
    <div class="placeholder-grid">
      <aside class="panel placeholder-menu"><strong data-i18n="settings">設定</strong><p class="placeholder-muted" data-i18n="settingsSubtitle">CMDプレイグラウンドの動作設定</p></aside>
      <main class="panel placeholder-content">
        <h2 data-i18n="settings">設定</h2>
        <section class="setting-section" aria-labelledby="resetSettingHeading">
          <h3 id="resetSettingHeading" data-i18n="explorer">疑似エクスプローラー</h3>
          <label class="setting-toggle-row" for="confirmResetToggle">
            <span class="setting-toggle-copy">
              <strong data-i18n="resetConfirm">リセット時に確認ダイアログを表示する</strong>
              <span class="placeholder-muted" data-i18n="resetDesc">ONの場合、リセット実行前に確認します。キャンセルするとデータは初期化されません。</span>
            </span>
            <input id="confirmResetToggle" type="checkbox" checked />
          </label>
          <p class="setting-status" id="settingsSaveStatus" role="status" aria-live="polite">現在の設定を読み込んでいます。</p>
          <p class="placeholder-muted setting-note" data-i18n="cookieNote">初期値はONです。設定はセッションCookieに保存されます（ブラウザのセッション復元によって残る場合があります）。</p>
        </section>
        <section class="setting-section language-section" aria-labelledby="languageSettingHeading">
          <h3 id="languageSettingHeading" data-i18n="language">表示言語</h3>
          <p class="placeholder-muted" data-i18n="languageDesc">画面の表示言語を選択します。選択しただけでは変更されず、「適用」を押すと反映されます。</p>
          <div class="language-select-row">
            <select id="languageSelect" aria-labelledby="languageSettingHeading">
              <option value="ja">日本語</option>
              <option value="en">English</option>
            </select>
            <button type="button" id="applyLanguageButton" data-i18n="apply" disabled>適用</button>
          </div>
          <p id="languageSaveStatus" class="setting-status" role="status" aria-live="polite"></p>
        </section>
      </main>
    </div>
  </div>
  <script type="module" src="../js/settings.js?v=16"></script>
</body>
</html>
