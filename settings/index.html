<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>設定 | Windows CMD</title>
  <link rel="stylesheet" href="../css/style.css?v=4" />
</head>
<body>
  <div class="placeholder-shell">
    <header class="placeholder-topbar"><a class="placeholder-back" href="../">← CMD編に戻る</a><h1>Windows CMD</h1></header>
    <div class="placeholder-grid">
      <aside class="panel placeholder-menu"><strong>設定</strong><p class="placeholder-muted">CMDプレイグラウンドの動作設定</p></aside>
      <main class="panel placeholder-content">
        <h2>設定</h2>
        <section class="setting-section" aria-labelledby="resetSettingHeading">
          <h3 id="resetSettingHeading">疑似エクスプローラー</h3>
          <label class="setting-toggle-row" for="confirmResetToggle">
            <span class="setting-toggle-copy">
              <strong>リセット時に確認ダイアログを表示する</strong>
              <span class="placeholder-muted">ONの場合、リセット実行前に確認します。キャンセルするとデータは初期化されません。</span>
            </span>
            <input id="confirmResetToggle" type="checkbox" checked />
          </label>
          <p class="setting-status" id="settingsSaveStatus" role="status" aria-live="polite">現在の設定を読み込んでいます。</p>
          <p class="placeholder-muted setting-note">初期値はONです。設定はセッションCookieに保存され、通常はブラウザのセッション終了時に失われます（ブラウザのセッション復元機能により残る場合があります）。CookieにはON/OFFのみを保存します。</p>
        </section>
      </main>
    </div>
  </div>
  <script type="module" src="../js/settings.js?v=4"></script>
</body>
</html>
