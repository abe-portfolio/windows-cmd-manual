<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Windows CMD Manual</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-2: #1f2937;
        --line: #374151;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #60a5fa;
        --accent-2: #34d399;
        --warning: #fbbf24;
        --danger: #f87171;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(180deg, #0b1120 0%, #111827 100%);
        color: var(--text);
      }

      .app {
        display: grid;
        grid-template-columns: 280px 1fr;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
      }

      .sidebar {
        background: rgba(15, 23, 42, 0.95);
        border-right: 1px solid var(--line);
        padding: 20px 16px;
        overflow-y: auto;
        min-height: 0;
      }

      .sidebar-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .menu-toggle {
        display: none;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        flex-shrink: 0;
        color: var(--text);
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 10px;
        cursor: pointer;
      }

      .menu-toggle svg { width: 23px; height: 23px; }

      .sidebar h1 {
        margin: 0 0 18px;
        font-size: 1.1rem;
        letter-spacing: 0.08em;
      }

      .command-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .command-link {
        display: block;
        width: 100%;
        border: 1px solid transparent;
        background: rgba(148, 163, 184, 0.08);
        color: var(--text);
        text-align: left;
        padding: 10px 12px;
        border-radius: 10px;
        cursor: pointer;
        text-decoration: none;
        transition: 0.2s ease;
      }

      .command-link:hover,
      .command-link.active {
        border-color: rgba(96, 165, 250, 0.7);
        background: rgba(96, 165, 250, 0.12);
      }

      .command-name {
        font-weight: 700;
        font-size: 0.98rem;
      }

      .command-summary {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 0.8rem;
      }

      .main {
        display: grid;
        grid-template-columns: minmax(240px, 360px) minmax(360px, 1fr);
        gap: 20px;
        padding: 22px;
        min-height: 0;
        min-width: 0;
      }

      .panel {
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid var(--line);
        border-radius: 16px;
        overflow: auto;
        min-height: 0;
      }

      .panel-header {
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
        background: rgba(31, 41, 55, 0.9);
        font-weight: 700;
      }

      .detail {
        padding: 18px 16px;
      }

      .detail h2 {
        margin: 0 0 10px;
        font-size: 1.25rem;
      }

      .badge {
        display: inline-block;
        background: rgba(52, 211, 153, 0.15);
        color: var(--accent-2);
        border: 1px solid rgba(52, 211, 153, 0.4);
        border-radius: 999px;
        padding: 4px 10px;
        font-size: 0.78rem;
        margin-bottom: 10px;
      }

      .syntax {
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid var(--line);
        padding: 10px 12px;
        border-radius: 10px;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        color: #dbeafe;
        margin-bottom: 14px;
      }

      .option-list {
        margin: 0;
        padding-left: 18px;
        color: var(--text);
      }

      .option-list li {
        margin-bottom: 10px;
        line-height: 1.5;
      }

      .terminal-pane {
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow: hidden;
      }

      .terminal-output {
        flex: 1;
        background: #020817;
        color: #d1fae5;
        min-height: 0;
        padding: 18px 18px 10px;
        font-family: "SFMono-Regular", Consolas, monospace;
        line-height: 1.5;
        white-space: pre-wrap;
        overflow: auto;
      }

      .terminal-form {
        flex-shrink: 0;
        display: flex;
        gap: 8px;
        padding: 12px 16px 16px;
        background: rgba(15, 23, 42, 0.8);
        border-top: 1px solid var(--line);
      }

      .prompt {
        color: var(--accent-2);
        font-weight: 700;
        font-family: "SFMono-Regular", Consolas, monospace;
      }

      .terminal-form input {
        flex: 1;
        background: rgba(2, 8, 23, 0.8);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 0.96rem;
      }

      .terminal-form button {
        background: var(--accent);
        color: #0f172a;
        border: none;
        border-radius: 8px;
        padding: 10px 14px;
        font-weight: 700;
        cursor: pointer;
      }

      .explorer-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
      .reset-button { border: 1px solid var(--line); background: rgba(148,163,184,.10); color: var(--text); border-radius: 8px; padding: 5px 10px; cursor: pointer; font-weight: 600; }
      .reset-button:hover { border-color: var(--accent); }
      .explorer {
        padding: 16px;
        flex-shrink: 0;
        max-height: 38%;
        overflow-y: auto;
      }

      .path {
        color: var(--muted);
        margin: 0 0 10px;
        font-family: "SFMono-Regular", Consolas, monospace;
      }

      .tree {
        list-style: none;
        margin: 0;
        padding-left: 16px;
      }

      .tree ul {
        list-style: none;
        margin-top: 6px;
        padding-left: 18px;
      }

      .tree li {
        margin: 6px 0;
        color: var(--text);
      }

      .tree li.current-directory {
        color: var(--accent-2);
        font-weight: 700;
      }

      .folder::before {
        content: "📁 ";
      }

      .file::before {
        content: "📄 ";
      }

      @media (max-width: 960px) {
        .sidebar {
          padding: 14px 16px;
          border-right: 0;
          border-bottom: 1px solid var(--line);
          overflow: visible;
        }

        .sidebar h1 { margin: 0; }

        .menu-toggle { display: flex; }

        .sidebar .command-list { display: none; }

        /* モバイル起動時は詳細を隠し、選択された場合だけ表示する */
        .command-detail-panel:not(.mobile-detail-visible) { display: none; }

        .sidebar.menu-open .command-list {
          display: flex;
          margin-top: 16px;
          max-height: 55dvh;
          overflow-y: auto;
        }

        .app {
          grid-template-columns: 1fr;
          height: auto;
          min-height: 100dvh;
          overflow: visible;
        }

        .main {
          grid-template-columns: 1fr;
        }

        .terminal-pane {
          height: 70dvh;
          min-height: 360px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="commandSidebar">
        <div class="sidebar-heading">
          <h1>Windows CMD</h1>
          <button id="menuToggle" class="menu-toggle" type="button" aria-label="コマンド一覧を開く" aria-expanded="false" aria-controls="commandList">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <path d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>
        </div>
        <nav id="commandList" class="command-list" aria-label="コマンド一覧"></nav>
      </aside>

      <main class="main">
        <section class="panel command-detail-panel" id="commandDetailPanel">
          <div class="panel-header">コマンド詳細</div>
          <div id="commandDetail" class="detail"></div>
        </section>

        <section class="panel terminal-pane">
          <div class="panel-header explorer-header"><span>擬似エクスプローラ</span><button type="button" id="resetButton" class="reset-button">↻ リセット</button></div>
          <div class="explorer">
            <div id="currentPath" class="path">C:\WORK</div>
            <ul id="explorerTree" class="tree"></ul>
          </div>
          <div id="terminalOutput" class="terminal-output" aria-live="polite"></div>
          <form id="terminalForm" class="terminal-form">
            <input id="terminalInput" type="text" autocomplete="off" spellcheck="false" placeholder="コマンドを入力" />
            <button type="submit">実行</button>
          </form>
        </section>
      </main>
    </div>

    <script>
      const commandCatalog = {
        mkdir: {
          name: 'mkdir',
          summary: 'フォルダを作成する',
          syntax: 'mkdir <folderName>',
          description: '指定した名前のフォルダを作成します。実際のファイルシステムには影響せず、擬似エクスプローラ上で表示されます。',
          options: ['現時点ではオプション未対応（Windows CMD の mkdir は -p を必要としません）', '<strong>md</strong> : mkdir の別名'],
          validator: (args) => {
            if (!args.length) return { ok: false, message: 'mkdir には作成先の名前が必要です。例: mkdir hoge' };
            if (args.length !== 1 || args[0].startsWith('-')) return { ok: false, message: '構文エラーです。例: mkdir hoge' };
            return { ok: true };
          }
        },
        dir: {
          name: 'dir',
          summary: '現在のディレクトリの内容を表示する',
          syntax: 'dir [options]',
          description: '現在の場所にあるファイルとフォルダを一覧表示します。',
          options: [
            '<strong>/a</strong> : 隠しファイルも含めて表示',
            '<strong>/w</strong> : 横並びで表示'
          ],
          validator: (args) => {
            const unsupported = args.find((arg) => arg.startsWith('/') && !['/a', '/w'].includes(arg.toLowerCase()));
            if (args.filter(a=>!a.startsWith('/')).length>1) return {ok:false,message:'構文: dir [pattern] [/a] [/w]'};
            if (unsupported) {
              return { ok: false, message: `未対応のオプションです: ${unsupported}` };
            }
            return { ok: true };
          }
        },
        cd: {
          name: 'cd',
          summary: '作業ディレクトリを移動する',
          syntax: 'cd [/d] [drive:][path] / chdir [/d] [drive:][path]',
          description: '現在のパスを表示・変更します。別ドライブへ切り替える場合は cd /d D:\\DATA、または D: と入力します。cd D:\\DATA だけではドライブは切り替わりません。',
          options: [
            '<strong>..</strong> : 親フォルダへ移動',
            '<strong>\\</strong> : 現在のドライブのルートへ移動',
            '<strong>/d</strong> : ドライブも同時に切り替える',
            '<strong>D:</strong> : Dドライブの現在位置へ切り替える',
            '<strong>chdir</strong> : cd と同じコマンド',
            '<strong>¥ / ￥</strong> : 日本語キーボードの円記号もパス区切りとして受付'
          ],
          validator: (args) => {
            if (args.length > 2 || (args.length === 2 && args[0].toLowerCase() !== '/d') || (args.length === 1 && args[0].toLowerCase() === '/d')) return { ok: false, message: '構文エラーです。例: cd / cd hoge / cd /d D:\\DATA' };
            return { ok: true };
          }
        },
        echo: {
          name: 'echo',
          summary: '文字列を表示する',
          syntax: 'echo [message]',
          description: '指定した文字列をターミナルに出力します。',
          options: [
            '<strong>--help</strong> : 利用方法を表示'
          ],
          validator: (args) => {
            if (args[0] === '--help') return { ok: true };
            if (!args.length) return { ok: false, message: 'echo には表示したい文字列が必要です。' };
            return { ok: true };
          }
        },
        cls: {
          name: 'cls',
          summary: '画面をクリアする',
          syntax: 'cls',
          description: 'ターミナル画面に出力されている履歴を消去します。',
          options: [],
          validator: () => ({ ok: true })
        },

        del: { name:'del', summary:'ファイルを削除する', syntax:'del [/q] <file>', description:'ファイルを削除します。別名: erase。/q は確認なしです（シミュレータでは常に確認なし）。', options:['<strong>/q</strong> : 確認を省略','<strong>erase</strong> : del の別名'], validator: a => a.length && a.filter(x=>x.toLowerCase()!=='/q').length===1 ? {ok:true}:{ok:false,message:'構文: del [/q] <file>'} },
        rmdir: { name:'rmdir', summary:'フォルダを削除する', syntax:'rmdir [/s] [/q] <folder>', description:'空のフォルダを削除します。/s は中身もすべて削除。別名: rd。', options:['<strong>/s</strong> : 配下も削除','<strong>/q</strong> : 確認なし','<strong>rd</strong> : rmdir の別名'], validator:a=>a.length && a.filter(x=>!['/s','/q'].includes(x.toLowerCase())).length===1 ? {ok:true}:{ok:false,message:'構文: rmdir [/s] [/q] <folder>'} },
        copy: {
          name:'copy', summary:'ファイルをコピーする', syntax:'copy [options] <source> [destination]',
          description:'ファイルをコピーします。コピー先がフォルダの場合は元のファイル名を使用します。以下のオプションはWindows CMDの仕様を紹介するもので、現在のシミュレータでは未対応です。',
          options:[
            '<strong>/a</strong> : ASCIIテキストファイルとして扱う（未対応）',
            '<strong>/b</strong> : バイナリファイルとして扱う（未対応）',
            '<strong>/v</strong> : コピー後に書き込みを検証する（未対応）',
            '<strong>/y</strong> : 上書き確認を省略する（未対応）',
            '<strong>/-y</strong> : 上書き確認を表示する（未対応）',
            '<strong>/z</strong> : ネットワークコピーを再開可能モードで行う（未対応）',
            '<strong>/d</strong> : 暗号化されたファイルを復号した状態でコピーできるようにする（未対応）',
            '<strong>/n</strong> : 利用可能な場合、短いファイル名を使用する（未対応）',
            '<strong>/?</strong> : ヘルプを表示する（未対応）'
          ],
          examples:[
            {code:'copy notes.txt backup.txt',note:'notes.txt を backup.txt としてコピー（シミュレータで実行可能）'},
            {code:'copy notes.txt docs\\',note:'notes.txt を docs フォルダへコピー（シミュレータで実行可能）'},
            {code:'copy /y notes.txt backup.txt',note:'上書き確認を省略してコピー（オプションは未対応）'},
            {code:'copy /b a.bin+b.bin combined.bin',note:'バイナリファイルを結合（未対応）'}
          ],
          validator:a=>a.length===2?{ok:true}:{ok:false,message:'構文: copy <source> <destination>（オプション未対応）'}
        },
        xcopy: { name:'xcopy', summary:'ファイル・フォルダをコピーする', syntax:'xcopy <source> <destination> [/s] [/e] [/i] [/y]', description:'ディレクトリもコピー可能です。基本動作を再現します。', options:['<strong>/s</strong> : 空でないサブフォルダもコピー','<strong>/e</strong> : 空フォルダもコピー','<strong>/i</strong> : コピー先をフォルダとみなす','<strong>/y</strong> : 上書き確認を省略（本シミュレータは確認なし）'], validator:a=>a.filter(x=>!x.startsWith('/')).length===2 && a.every(x=>!x.startsWith('/')||['/s','/e','/i','/y'].includes(x.toLowerCase()))?{ok:true}:{ok:false,message:'構文: xcopy <source> <destination> [/s] [/e] [/i] [/y]'} },
        robocopy: { name:'robocopy', summary:'フォルダ間でファイルをコピーする', syntax:'robocopy <sourceDir> <destDir> [/s] [/e] [/mir] [/l]', description:'ディレクトリのコピーとミラーリングを簡易再現。/mir はコピー先の余剰ファイルを削除します。', options:['<strong>/s</strong> : 空でないサブフォルダをコピー','<strong>/e</strong> : 空フォルダを含む','<strong>/mir</strong> : コピー先をミラー化（余剰を削除）','<strong>/l</strong> : 実際には変更せず対象を表示'], validator:a=>a.filter(x=>!x.startsWith('/')).length===2 && a.every(x=>!x.startsWith('/')||['/s','/e','/mir','/l'].includes(x.toLowerCase()))?{ok:true}:{ok:false,message:'構文: robocopy <sourceDir> <destDir> [/s] [/e] [/mir] [/l]'} },
        move: { name:'move', summary:'ファイル・フォルダを移動する', syntax:'move <source> <destination>', description:'ファイルやフォルダを移動・改名します。', options:['オプションは今回未対応'], validator:a=>a.length===2?{ok:true}:{ok:false,message:'構文: move <source> <destination>'} },
        ren: { name:'ren', summary:'ファイル・フォルダの名前を変更する', syntax:'ren <oldName> <newName>', description:'同じ場所で名前を変更します。別名: rename。', options:['<strong>rename</strong> : ren の別名'], validator:a=>a.length===2?{ok:true}:{ok:false,message:'構文: ren <oldName> <newName>'} },
        tree: { name:'tree', summary:'フォルダ構造をツリー表示する', syntax:'tree [path] [/f] [/a]', description:'ディレクトリ構造をテキストで表示します。', options:['<strong>/f</strong> : ファイルも表示','<strong>/a</strong> : ASCII記号で表示'], validator:a=>a.filter(x=>!x.startsWith('/')).length<=1 && a.every(x=>!x.startsWith('/')||['/f','/a'].includes(x.toLowerCase()))?{ok:true}:{ok:false,message:'構文: tree [path] [/f] [/a]'} },
        redirect: {
          name:'redirect', summary:'出力をファイルへ保存する（> / >>）',
          syntax:'command > file / command >> file',
          description:'標準出力を仮想ファイルに保存します。> は上書き、>> は追記です。ファイルがなければ新規作成します。CMDではリダイレクトは独立したコマンドではなく演算子です。',
          options:['<strong>&gt;</strong> : 出力先を上書き','<strong>&gt;&gt;</strong> : 出力先に追記','<strong>2&gt;</strong> : 標準エラー出力のリダイレクト（未対応）','<strong>&lt;</strong> : ファイルからの標準入力（未対応）'],
          examples:[{code:'echo Hello > hello.txt',note:'ファイルを新規作成、または上書き'},{code:'echo World >> hello.txt',note:'既存ファイルの末尾に追記'},{code:'dir > files.txt',note:'ディレクトリ一覧を保存'},{code:'type hello.txt',note:'保存した内容を表示'}],
          validator:()=>({ok:false,message:'リダイレクトはコマンドの後ろに指定してください。例: echo Hello > hello.txt'})
        },
        pipe: {
          name:'pipe', summary:'前のコマンドの出力を次のコマンドへ渡す（|）',
          syntax:'command1 | command2',
          description:'左側のコマンドの標準出力を右側へ渡します。学習用として find、findstr、type と組み合わせる基本パターンに対応しています。',
          options:['<strong>|</strong> : 標準出力を次のコマンドへ渡す','<strong>&amp;&amp; / ||</strong> : 条件付きコマンド実行（未対応）'],
          examples:[{code:'echo ERROR found | find "ERROR"',note:'標準出力から ERROR を検索'},{code:'type notes.txt | findstr /i "error"',note:'ファイル内容をパイプ経由で検索'},{code:'dir | find ".txt"',note:'ディレクトリ表示を絞り込む'}],
          validator:()=>({ok:false,message:'パイプはコマンドの間に指定してください。例: dir | find ".txt"'})
        },
        ping: {
          name:'ping', summary:'宛先との疎通を確認する（疑似実行）',
          syntax:'ping [-n count] [-w timeout] host',
          description:'ICMP Echo要求の疎通確認です。実際の通信はせず、127.0.0.1〜127.0.0.5 を学習用の固定シナリオに割り当てています。注意：実際のWindowsでは127.0.0.2以降もループバックアドレスであり、これらのIPアドレスが本来エラーになるわけではありません。',
          scenarios:[
            '<strong>127.0.0.1</strong> : 正常応答（受信100%、損失0%）',
            '<strong>127.0.0.2</strong> : 要求がタイムアウトしました（損失100%・疑似）',
            '<strong>127.0.0.3</strong> : 宛先ホストに到達できません（疑似）',
            '<strong>127.0.0.4</strong> : 応答とタイムアウトが交互に起こる（部分的なパケット損失・疑似）',
            '<strong>127.0.0.5</strong> : 一般エラー（送信処理に失敗した例・疑似）',
            '<strong>存在しないホスト名</strong> : 名前解決エラー（例: ping nonexistent.invalid・疑似）'
          ],
          options:[
            '<strong>-n 数</strong> : 送信回数（1〜10）',
            '<strong>-w ミリ秒</strong> : 応答待ちタイムアウト（疑似表示）',
            '<strong>-t</strong> : 停止まで繰り返す（未対応）',
            '<strong>-4 / -6</strong> : IPバージョン指定（未対応）'
          ],
          examples:[
            {code:'ping 127.0.0.1',note:'正常：すべて応答する'},
            {code:'ping 127.0.0.2',note:'異常：すべてタイムアウトする（疑似）'},
            {code:'ping 127.0.0.3',note:'異常：宛先ホストに到達できない（疑似）'},
            {code:'ping -n 4 127.0.0.4',note:'異常：一部だけ応答する（疑似）'},
            {code:'ping 127.0.0.5',note:'異常：一般エラー（疑似）'},

      const commandAliases = { md: 'mkdir', chdir: 'cd', erase: 'del', rd: 'rmdir', rename: 'ren' };
      // 一覧と詳細画面は同じ別名定義からタイトルを生成する。
      function displayCommandName(commandName) {
        const aliases = Object.keys(commandAliases).filter(alias => commandAliases[alias] === commandName);
        return aliases.length ? `${commandName} (${aliases.join(', ')})` : commandName;
      }

      const commandListEl = document.getElementById('commandList');
      const commandSidebarEl = document.getElementById('commandSidebar');
      const menuToggleEl = document.getElementById('menuToggle');
      const commandDetailPanelEl = document.getElementById('commandDetailPanel');

      function setMobileMenuOpen(isOpen) {

        menuToggleEl.setAttribute('aria-label', isOpen ? 'コマンド一覧を閉じる' : 'コマンド一覧を開く');
      }

      menuToggleEl.addEventListener('click', () => {
        const opening = !commandSidebarEl.classList.contains('menu-open');
        setMobileMenuOpen(opening);
        // メニューを閉じる操作では、以前選択したコマンドの詳細も隠す。
        if (!opening) commandDetailPanelEl.classList.remove('mobile-detail-visible');
      });
      const commandDetailEl = document.getElementById('commandDetail');
      const terminalOutputEl = document.getElementById('terminalOutput');
      const terminalInputEl = document.getElementById('terminalInput');
      const explorerTreeEl = document.getElementById('explorerTree');
      const currentPathEl = document.getElementById('currentPath');
      const terminalFormEl = document.getElementById('terminalForm');

      function initCommandList() {
        Object.values(commandCatalog).forEach((command) => {
          const link = document.createElement('button');
          link.type = 'button';
          link.className = 'command-link';
          link.dataset.commandName = command.name;
          link.innerHTML = `
            <span class="command-name">${command.name === 'redirect' ? 'リダイレクト' : command.name === 'pipe' ? 'パイプ' : displayCommandName(command.name)}</span>
            <span class="command-summary">${command.summary}</span>

          link.addEventListener('click', () => {
            state.history = [];
            resetInputNavigation(true);

            // 選択時だけ詳細を表示し、一覧を閉じる（PCでは常時表示）。

      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
      }

      function renderCommandDetail(commandName) {
        const command = commandCatalog[commandName];
        if (!command) return;

        document.querySelectorAll('.command-link').forEach((button) => {
          button.classList.toggle('active', button.dataset.commandName === commandName);
        });

        commandDetailEl.innerHTML = `
          <span class="badge">Windows CMD</span>
          <h2>${displayCommandName(command.name)}</h2>
          <div class="syntax">${command.syntax}</div>
          <p>${command.description}</p>
          ${command.scenarios ? `<h3>学習用シナリオ</h3><ul class="option-list">${command.scenarios.map(item => `<li>${item}</li>`).join('')}</ul>` : ''}
          <h3>オプション</h3>
          <ul class="option-list">
            ${command.options.length ? command.options.map((option) => `<li>${option}</li>`).join('') : '<li>オプションなし</li>'}
          </ul>
          ${command.examples ? `<h3>実行例</h3>${command.examples.map(example => `<div class="command-example"><div class="syntax">${escapeHtml(example.code)}</div><p>${escapeHtml(example.note)}</p></div>`).join('')}` : ''}
        `;
      }

      function getCurrentDirectoryEntries() {
        const entries = state.fs[state.currentPath] || [];
        return [...entries].sort((a, b) => a.localeCompare(b, 'ja', { numeric: true }));
      }

      function renderExplorer() {
        explorerTreeEl.innerHTML = ['C:\\', 'D:\\'].map(root => buildTree(root)).join('');
        currentPathEl.textContent = state.currentPath;
      }

      function buildTree(pathName) {
        const entries = state.fs[pathName] || [];
        const nested = entries.map(name => {
          const childPath = pathName.endsWith('\\') ? pathName + name : pathName + '\\' + name;
          const isFolder = Object.prototype.hasOwnProperty.call(state.fs, childPath);
          const current = childPath.toLowerCase() === state.currentPath.toLowerCase();
          const childTree = isFolder ? buildTree(childPath) : '';
          return `<li class="${isFolder ? 'folder' : 'file'}${current ? ' current-directory' : ''}">${escapeHtml(name)}${childTree ? `<ul>${childTree}</ul>` : ''}</li>`;
        }).join('');
        const isDrive = /^[CD]:\\$/.test(pathName);
        if (isDrive) {
          const current = pathName.toLowerCase() === state.currentPath.toLowerCase();
          return `<li class="folder${current ? ' current-directory' : ''}">${escapeHtml(pathName)}<ul>${nested}</ul></li>`;
        }
        return nested;
      }

      function escapeHtml(value) {
        return value.replace(/[&<>"']/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c]));
      }

      let stdoutCapture = null;
      function writeTerminalLine(line = '') {
        if (stdoutCapture) { stdoutCapture.push(String(line)); return; }
        const p = document.createElement('div');
        p.textContent = line;
        terminalOutputEl.appendChild(p);
        terminalOutputEl.scrollTop = terminalOutputEl.scrollHeight;
      }

      function normalizeCommand(rawInput) {
        const trimmed = rawInput.trim();
        if (!trimmed) return { command: '', args: [] };

        const match = trimmed.match(/^([^\s]+)(?:\s+(.+))?$/);
        if (!match) return { command: '', args: [] };

        const command = match[1].toLowerCase();
        const remainder = match[2] || '';
        const args = [...remainder.matchAll(/"([^"]*)"|([^\s"]+)/g)].map(m => m[1] ?? m[2]);
        return { command, args };
      }

      function suggestCommand(name) {
        const candidates = Object.keys(commandCatalog);
        let best = null;
        let bestScore = Infinity;

        for (const candidate of candidates) {
          const score = levenshtein(name, candidate);
          if (score < bestScore) {
            bestScore = score;
            best = candidate;
          }
        }

        return best && bestScore <= 3 ? best : null;
      }

      function levenshtein(a, b) {
        const dp = Array.from({ length: a.length + 1 }, () => new Array(b.length + 1).fill(0));
        for (let i = 0; i <= a.length; i++) dp[i][0] = i;
        for (let j = 0; j <= b.length; j++) dp[0][j] = j;

        for (let i = 1; i <= a.length; i++) {
          for (let j = 1; j <= b.length; j++) {
            const cost = a[i - 1] === b[j - 1] ? 0 : 1;
            dp[i][j] = Math.min(
              dp[i - 1][j] + 1,
              dp[i][j - 1] + 1,
              dp[i - 1][j - 1] + cost
            );
          }
        }

        return dp[a.length][b.length];
      }

      function commandExists(name) {
        return Object.prototype.hasOwnProperty.call(commandCatalog, name);
      }

      // Windows パスは入力の円記号 (¥, ￥, \) や大小文字に関係なく照合する。
      function normalizeSlashes(v) { return String(v).replace(/[¥￥＼﹨⧵]/g, '\\').replace(/\//g, '\\'); }
      function existingDir(path) { return Object.keys(state.fs).find(k => k.toLowerCase() === path.toLowerCase()); }
      function entryName(path) { return path.slice(path.lastIndexOf('\\')+1); }
      function getParentPath(path) {
        if (/^[a-z]:\\$/i.test(path)) return null;
        const at=path.lastIndexOf('\\'); return at<=2 ? path.slice(0,3) : path.slice(0,at);
      }
      function fileKey(path) { return String(path).toLowerCase(); }
      function fileContent(path) { return state.contents[fileKey(path)] ?? ''; }
      function setFileContent(path, value) { state.contents[fileKey(path)] = value; }
      function wildcardRegex(pattern) {
        const normalized = String(pattern).replace(/[.+^${}()|[\]\\]/g, '\\$&');
        return new RegExp('^' + normalized.replace(/\*/g, '.*').replace(/\?/g, '.') + '$', 'i');
      }
      function expandFiles(pattern, recursive=false) {
        const full = parsePathInput(pattern);
        if (!full) return [];
        const parent = getParentPath(full), folder = existingDir(parent || '');
        if (!folder) return [];
        const regex = wildcardRegex(entryName(full));
        const out = [];
        const visit = (dir) => {
          for (const name of state.fs[dir] || []) {
            const next = joinPath(dir, name), childDir = existingDir(next);
            if (childDir) { if (recursive) visit(childDir); }
            else if (regex.test(name)) out.push(next);
          }
        };
        visit(folder);
        return out.sort((a,b)=>a.localeCompare(b, 'ja', {numeric:true}));
      }
      function patternFiles(pattern, recursive=false) {
        return /[*?]/.test(pattern) ? expandFiles(pattern, recursive)
          : recursive ? expandFiles(pattern, true) : (getFile(parsePathInput(pattern) || '') ? [parsePathInput(pattern)] : []);
      }
      function linesFor(path) { return fileContent(path).split(/\r?\n/); }
      function wildcardSearchNames(directory, pattern, recurse=false) {
        const base = existingDir(directory);
        if (!base) return [];
        return expandFiles(joinPath(base,pattern),recurse);
      }
      function getFile(path) {
        const parent=existingDir(getParentPath(path)||'');
        return parent && state.fs[parent].find(v=>v.toLowerCase()===entryName(path).toLowerCase());
      }
      function pathExists(path) { return !!existingDir(path) || !!getFile(path); }
      function parsePathInput(target) {
        let input=normalizeSlashes(target||'.').trim();
        const match=/^([a-z]):/i.exec(input);
        const drive=match?match[1].toUpperCase():state.currentPath[0].toUpperCase();
        if (!Object.prototype.hasOwnProperty.call(state.drivePaths,drive)) return null;
        const remaining=match?input.slice(2):input;
        const base=remaining.startsWith('\\')?`${drive}:\\`:state.drivePaths[drive];
        const components=base.slice(3).split('\\').filter(Boolean);
        for(const part of remaining.split('\\')) {
          if(!part||part==='.')continue;
          if(part==='..')components.pop(); else components.push(part);
        }
        const candidate=`${drive}:\\${components.join('\\')}`;
        return existingDir(candidate) || (getFile(candidate) ? `${existingDir(getParentPath(candidate))}\\${getFile(candidate)}` : candidate);
      }
      function removePath(path) {
        const dir=existingDir(path);
        if(dir) {
          for(const name of [...state.fs[dir]])removePath(joinPath(dir,name));
          delete state.fs[dir];
        }
        delete state.contents[fileKey(path)];
        const parent=existingDir(getParentPath(path)||'');
        if(parent)state.fs[parent]=state.fs[parent].filter(n=>n.toLowerCase()!==entryName(path).toLowerCase());
      }
      function joinPath(dir,name) {return dir.endsWith('\\')?dir+name:dir+'\\'+name;}
      function addFileOrDirectory(path,isDir) {
        const parent=existingDir(getParentPath(path)||'');
        if(!parent)throw Error('親ディレクトリが存在しません: '+getParentPath(path));
        if(pathExists(path))throw Error('同名のファイルまたはフォルダが既に存在します: '+path);
        const name=entryName(path);
        if(!name||/[<>:"|?*]/.test(name))throw Error('無効な名前です: '+name);
        state.fs[parent].push(name);
        if(isDir)state.fs[joinPath(parent,name)]=[];
        else setFileContent(joinPath(parent,name), '');
      }
      function copyNode(src,dst,recursive=true,includeEmpty=true) {
        const isDir=!!existingDir(src);
        if(!isDir&&!getFile(src))throw Error('コピー元が存在しません: '+src);
        if(pathExists(dst)) {
          if(!isDir||!existingDir(dst))throw Error('コピー先が既に存在します: '+dst);
        } else addFileOrDirectory(dst,isDir);
        if (!isDir) setFileContent(dst, fileContent(src));
        if(isDir&&recursive) {
          for(const name of [...state.fs[existingDir(src)]]) {
            const child=joinPath(src,name), childDir=!!existingDir(child);
            if(childDir&&!includeEmpty&&!hasFiles(child))continue;
            copyNode(child,joinPath(dst,name),true,includeEmpty);
          }
        }
      }
      function hasFiles(path) {return state.fs[existingDir(path)].some(name=>!existingDir(joinPath(path,name))||hasFiles(joinPath(path,name)));}
      function resolveDestination(src,dstArg) {
        const dest=parsePathInput(dstArg);
        if(!dest)throw Error('コピー先ドライブが存在しません。');
        return existingDir(dest)?joinPath(existingDir(dest),entryName(src)):dest;
      }
      function safeMutation(fn) {try {fn();renderExplorer();}catch(e){writeTerminalLine(e.message);}}
      function drawTree(path,showFiles,ascii,depth=0) {
        const out=[depth===0?path:entryName(path)];
        const walk=(dir,prefix)=>{
          const children=state.fs[existingDir(dir)]||[];
          const names=children.filter(n=>showFiles||existingDir(joinPath(dir,n)));
          names.forEach((name,i)=>{
            const last=i===names.length-1;
            out.push(prefix+(ascii?(last?'\\-- ':'|-- '):(last?'└── ':'├── '))+name);
            const child=joinPath(dir,name);
            if(existingDir(child))walk(child,prefix+(ascii?(last?'    ':'|   '):(last?'    ':'│   ')));
          });
        };walk(path,'');return out.join('\n');
      }

      // 引用符内の演算子は特別扱いしない。CMDの全構文ではなく基本形の再現。
      function splitOperators(input, operator) {
        let quoted=false, start=0, chunks=[];
        for(let i=0;i<input.length;i++){
          if(input[i]==='"')quoted=!quoted;
          if(!quoted && input[i]===operator){
            if(operator==='|' && (input[i+1]==='|' || input[i-1]==='|'))return null;
            chunks.push(input.slice(start,i).trim()); start=i+1;
          }
        }
        chunks.push(input.slice(start).trim());
        return chunks;
      }
      function runCaptured(commandLine) {
        const old=stdoutCapture, output=[];
        stdoutCapture=output;
        try { executeCommand(commandLine, true); }
        finally { stdoutCapture=old; }
        return output.join('\n');
      }
      function runWithStdin(commandLine, stdin) {
        const parsed=normalizeCommand(commandLine);
        if(!['find','findstr'].includes(parsed.command)) {
          writeTerminalLine('パイプ受信側は find / findstr に対応しています。');return;
        }
        // 入力文字列は現在のフォルダの一時的な仮想ファイルへ流し込む。
        let num=0, name;
        do {name=`__cmd_pipe_${num++}.txt`;} while(pathExists(joinPath(state.currentPath,name)));
        const full=joinPath(state.currentPath,name);
        addFileOrDirectory(full,false);setFileContent(full,stdin);
        try {
          const lines=runCaptured(commandLine+' "'+name+'"');
          // 一時ファイルのパス表示は実際のパイプの標準入力に近い表示に置き換える。
          const cleaned=lines.replaceAll(full+':\n','').replaceAll(full+': ','');
          if(cleaned)writeTerminalLine(cleaned);
        } finally {removePath(full);}
      }
      function executeShellLine(line) {
        const pipes=splitOperators(line,'|');
        if(!pipes){writeTerminalLine('|| は未対応です。');return;}
        if(pipes.length>1){
          if(pipes.some(x=>!x)){writeTerminalLine('パイプの前後にコマンドを指定してください。');return;}
          if(pipes.length>2){writeTerminalLine('3段以上のパイプは未対応です。');return;}
          const left=runCaptured(pipes[0]);
          runWithStdin(pipes[1],left);
          return;
        }
        let quoted=false, op=-1, append=false;
        for(let i=0;i<line.length;i++){
          if(line[i]==='"')quoted=!quoted;
          else if(!quoted && line[i]==='>') {op=i;append=line[i+1]==='>';break;}
        }
        if(op>=0){
          const left=line.slice(0,op).trim(), destination=line.slice(op+(append?2:1)).trim().replace(/^"(.*)"$/,'$1');
          if(!left||!destination||/[<>|]/.test(destination)){writeTerminalLine('構文: コマンド > ファイル / コマンド >> ファイル');return;}
          const target=parsePathInput(destination);
          if(!target||existingDir(target)){writeTerminalLine('出力先ファイルを指定してください。');return;}
          const parent=existingDir(getParentPath(target)||'');
          if(!parent){writeTerminalLine('出力先のフォルダが見つかりません。');return;}
          const output=runCaptured(left);
          try {
            if(!pathExists(target))addFileOrDirectory(target,false);
            setFileContent(target,(append?fileContent(target):'')+output+'\r\n');
            renderExplorer();
          }catch(e){writeTerminalLine(e.message);}
          return;
        }
        executeCommand(line);
      }

      function executeCommand(rawInput) {
        const { command, args } = normalizeCommand(rawInput);

        if (!command) {
          return;
        }

        const actualCommand = commandAliases[command] || command;

        if (/^[a-z]:$/i.test(command)) {
          const drive = command[0].toUpperCase();
          if (!state.drivePaths[drive]) writeTerminalLine(`ドライブが見つかりません: ${drive}:`);
          else if (args.length) writeTerminalLine("ドライブ指定に引数は指定できません。");
          else { state.currentPath = state.drivePaths[drive]; renderExplorer(); }
          return;
        }

        const commandEntry = commandCatalog[actualCommand];

        if (!commandEntry) {
          const suggestion = suggestCommand(command);
          writeTerminalLine(`'${command}' は存在しません。`);
          if (suggestion) {
            writeTerminalLine(`もしかして: ${suggestion} ?`);
          }
          return;
        }

        const validation = commandEntry.validator(args);
        if (!validation.ok) {
          writeTerminalLine(validation.message);
          return;
        }

        switch (actualCommand) {
          case 'mkdir': {
            const dest=parsePathInput(args[0]);
            if(!dest){writeTerminalLine('ドライブが見つかりません。');break;}
            safeMutation(()=>{addFileOrDirectory(dest,true);writeTerminalLine(`作成しました: ${dest}`);});
            break;
          }

          case 'dir': {
            const pattern=args.find(a=>!a.startsWith('/'));
            const entries=pattern ? (()=>{
              const full=parsePathInput(pattern), parent=full && existingDir(getParentPath(full)||'');
              if (!parent) return [];
              const regex=wildcardRegex(entryName(full));
              return state.fs[parent].filter(name=>regex.test(name)).sort((a,b)=>a.localeCompare(b,'ja',{numeric:true}));
            })() : getCurrentDirectoryEntries();
            if (!entries.length) {
              writeTerminalLine('ファイルは見つかりませんでした。');
              return;
            }
            writeTerminalLine(entries.join('\n'));
            break;
          }

          case 'cd': {
            if (!args.length) { writeTerminalLine(state.currentPath); break; }
            if (args[0] === '/?') {
              writeTerminalLine('cd [/d] [drive:][path]  /d: ドライブも切り替え');
              break;
            }
            const hasD = args[0].toLowerCase() === '/d';
            const target = hasD ? args[1] : args[0];
            if (!target || (target.startsWith('/') && target !== '/')) {
              writeTerminalLine('構文エラーです。例: cd /d D:\\DATA'); break;
            }
            // cd D: は Dドライブの現在位置を表示する（ドライブは切り替えない）。
            if (/^[a-z]:$/i.test(target) && !hasD) {
              const drive = target[0].toUpperCase();
              writeTerminalLine(state.drivePaths[drive] || `ドライブが見つかりません: ${drive}:`);
              break;
            }
            const nextPath = parsePathInput(target);
            if (!nextPath || !Object.prototype.hasOwnProperty.call(state.fs, nextPath)) {
              writeTerminalLine(`指定されたパスが見つかりません: ${target}`); break;
            }
            const drive = nextPath[0].toUpperCase();
            state.drivePaths[drive] = nextPath;
            if (hasD || drive === state.currentPath[0].toUpperCase()) {
              state.currentPath = nextPath;
              writeTerminalLine(`現在の場所: ${state.currentPath}`);
              renderExplorer();
            } else {
              writeTerminalLine(`${drive}: の現在位置を ${nextPath} に変更しました（ドライブの切り替えには /d を使用）。`);
            }
            break;
          }

          case 'del': {
            const pattern=args.find(x=>x.toLowerCase()!=='/q');
            const path=parsePathInput(pattern);
            if(!path){writeTerminalLine('指定されたドライブが見つかりません。');break;}
            safeMutation(()=>{
              if(existingDir(path))throw Error('フォルダは del で削除できません。rmdir を使用してください。');
              const paths=patternFiles(pattern);
              if(!paths.length)throw Error('ファイルが存在しません: '+pattern);
              for(const file of paths)removePath(file);
              writeTerminalLine(`${paths.length} 件削除しました: ${paths.join(', ')}`);
            });break;
          }
          case 'rmdir': {
            const recursive=args.some(x=>x.toLowerCase()==='/s');
            const path=parsePathInput(args.find(x=>!['/s','/q'].includes(x.toLowerCase())));
            safeMutation(()=>{
              const dir=path&&existingDir(path);
              if(!dir)throw Error('ディレクトリが存在しません: '+args.join(' '));
              if(/^[a-z]:\\$/i.test(dir))throw Error('ドライブのルートは削除できません。');
              if(Object.values(state.drivePaths).some(p=>p.toLowerCase()===dir.toLowerCase())||state.currentPath.toLowerCase()===dir.toLowerCase()||state.currentPath.toLowerCase().startsWith(dir.toLowerCase()+'\\'))throw Error('使用中のディレクトリは削除できません。');
              if(state.fs[dir].length&&!recursive)throw Error('ディレクトリが空ではありません。/s を指定してください。');
              removePath(dir);writeTerminalLine('削除しました: '+dir);
            });break;
          }
          case 'copy': {
            safeMutation(()=>{
              const sources=patternFiles(args[0]);
              if(!sources.length)throw Error('コピー元ファイルが見つかりません。');
              if(sources.length>1 && !existingDir(parsePathInput(args[1])))throw Error('複数ファイルのコピー先には既存のフォルダを指定してください。');
              for(const src of sources){
                const dst=resolveDestination(src,args[1]);
                if(src.toLowerCase()===dst.toLowerCase())throw Error('コピー元とコピー先が同じです。');

              const src=parsePathInput(names[0]);if(!src||!pathExists(src))throw Error('コピー元が見つかりません。');
              const dest=parsePathInput(names[1]);
              const dir=!!existingDir(src);
              if(dir&&(dest.toLowerCase()===src.toLowerCase()||dest.toLowerCase().startsWith(src.toLowerCase()+'\\')))throw Error('ディレクトリを自身の配下へコピーできません。');
              if(dir){
                if(!existingDir(dest))addFileOrDirectory(dest,true);
                for(const name of [...state.fs[existingDir(src)]]){
                  const child=joinPath(src,name),folder=!!existingDir(child);
                  if(folder&&!flags.some(f=>['/s','/e'].includes(f)))continue;
                  if(folder&&!flags.includes('/e')&&!hasFiles(child))continue;
                  copyNode(child,joinPath(dest,name),true,flags.includes('/e'));
                }
              }else copyNode(src,resolveDestination(src,names[1]));
              writeTerminalLine('コピーが完了しました: '+dest);
            });break;
          }
          case 'robocopy': {
            safeMutation(()=>{
              const names=args.filter(x=>!x.startsWith('/'));const flags=args.filter(x=>x.startsWith('/')).map(x=>x.toLowerCase());
              const src=parsePathInput(names[0]),dst=parsePathInput(names[1]);
              if(!src||!existingDir(src))throw Error('コピー元フォルダが存在しません。');
              if(!dst)throw Error('コピー先のドライブが存在しません。');
              if(dst.toLowerCase()===src.toLowerCase()||dst.toLowerCase().startsWith(src.toLowerCase()+'\\'))throw Error('コピー先はコピー元の配下に指定できません。');
              if(flags.includes('/l')){writeTerminalLine('プレビュー（変更なし）: '+src+' -> '+dst);return;}
              if(!existingDir(dst))addFileOrDirectory(dst,true);
              const mir=flags.includes('/mir'),recursive=mir||flags.includes('/s')||flags.includes('/e');
              const sync=(from,to)=>{
                const children=[...state.fs[existingDir(from)]];
                for(const name of children){
                  const f=joinPath(from,name),d=joinPath(to,name),folder=!!existingDir(f);
                  if(folder){
                    if(!recursive||(!mir&&!flags.includes('/e')&&!hasFiles(f)))continue;
                    if(!existingDir(d)){if(pathExists(d))throw Error('コピー先に同名のファイルがあります: '+d);addFileOrDirectory(d,true);}
                    sync(f,d);
                  }else if(!pathExists(d)){addFileOrDirectory(d,false);setFileContent(d,fileContent(f));}
                  else if(existingDir(d))throw Error('コピー先に同名のフォルダがあります: '+d);
                  else setFileContent(d,fileContent(f));
                }
                if(mir)for(const name of [...state.fs[existingDir(to)]]){
                  if(!children.some(x=>x.toLowerCase()===name.toLowerCase()))removePath(joinPath(to,name));
                }
              };
              sync(src,dst);writeTerminalLine('robocopy 完了: '+src+' -> '+dst);
            });break;
          }
          case 'move':
          case 'ren': {
            safeMutation(()=>{
              const src=parsePathInput(args[0]);if(!src||!pathExists(src))throw Error('移動元が存在しません。');
              if(/^[a-z]:\\$/i.test(src))throw Error('ルートは移動できません。');
              const dst=actualCommand==='ren'?joinPath(getParentPath(src),args[1]):resolveDestination(src,args[1]);
              if(actualCommand==='ren'&&(/[\\/:*?"<>|¥￥]/.test(args[1])||!args[1]))throw Error('ren の新しい名前にはパスを指定できません。');
              if(dst.toLowerCase()===src.toLowerCase())throw Error('移動元と移動先が同じです。');
              if(pathExists(dst))throw Error('移動先が既に存在します: '+dst);
              const folder=!!existingDir(src);
              if(folder&&(dst.toLowerCase().startsWith(src.toLowerCase()+'\\')||Object.values(state.drivePaths).some(p=>p.toLowerCase()===src.toLowerCase())||state.currentPath.toLowerCase()===src.toLowerCase()||state.currentPath.toLowerCase().startsWith(src.toLowerCase()+'\\')))throw Error('現在使用中のフォルダや自身の配下へは移動できません。');
              if(folder){copyNode(src,dst);removePath(src);}else {addFileOrDirectory(dst,false);setFileContent(dst,fileContent(src));removePath(src);}
              writeTerminalLine('変更しました: '+src+' -> '+dst);
            });break;
          }
          case 'find':
          case 'findstr': {
            const isStr=actualCommand==='findstr';
            const optNames=isStr?['/i','/n','/s','/m','/r','/l']:['/i','/n','/v','/c'];
            const flags=args.filter(a=>optNames.includes(a.toLowerCase())).map(a=>a.toLowerCase());
            const invalid=args.find(a=>a.startsWith('/')&&!optNames.includes(a.toLowerCase())&&!(isStr&&a.toLowerCase().startsWith('/c:')));
            if(invalid){writeTerminalLine('未対応のオプション: '+invalid);break;}
            const words=args.filter(a=>!optNames.includes(a.toLowerCase())&&!a.toLowerCase().startsWith('/c:'));
            const cArg=isStr?args.find(a=>a.toLowerCase().startsWith('/c:')):null;
            const query=cArg?cArg.slice(3):words.shift();
            if(!query){writeTerminalLine('検索文字列を指定してください。');break;}
            const patterns=words.length?words:['*.txt'];
            const paths=[...new Set(patterns.flatMap(pattern=>patternFiles(pattern, flags.includes('/s'))))];
            if(!paths.length){writeTerminalLine('検索対象のファイルが見つかりません。');break;}
            let regex;
            if(isStr&&!flags.includes('/l')) {
              try {regex=new RegExp(query, flags.includes('/i')?'i':'');}
              catch(e){writeTerminalLine('検索パターンが不正です: '+e.message);break;}
            }
            let found=0;
            for(const path of paths){
              let count=0;
              const output=[];
              linesFor(path).forEach((line,i)=>{
                const matching=regex?regex.test(line):(flags.includes('/i')?line.toLowerCase().includes(query.toLowerCase()):line.includes(query));
                const selected=flags.includes('/v')&&!isStr?!matching:matching;
                if(selected){count++;output.push(`${flags.includes('/n')?`[${i+1}]`:''}${line}`);}
              });
              found+=count;
              if(!isStr&&flags.includes('/c'))writeTerminalLine(`${path}: ${count}`);
              else if(isStr&&flags.includes('/m')){if(count)writeTerminalLine(path);}
              else if(output.length)writeTerminalLine(`${path}:\n${output.join('\n')}`);
            }
            if(!found)writeTerminalLine('一致する行はありません。');
            break;
          }
          case 'where': {
            const recursive=args[0]?.toLowerCase()==='/r';
            const base=recursive?parsePathInput(args[1]):state.currentPath;
            const patterns=recursive?args.slice(2):args;
            if(!base||!existingDir(base)||!patterns.length){writeTerminalLine('構文: where [/r directory] pattern');break;}
            if(patterns.some(p=>p.startsWith('/'))){writeTerminalLine('未対応のオプションです。');break;}
            const out=[...new Set(patterns.flatMap(pattern=>{
              const full=/^[a-z]:|[\\¥￥]/i.test(pattern)?parsePathInput(pattern):joinPath(base,pattern);
              if(!full)return [];
              const parent=getParentPath(full);
              return parent?wildcardSearchNames(parent,entryName(full),recursive):[];
            }))];
            writeTerminalLine(out.length?out.join('\n'):'INFO: 指定されたパターンのファイルが見つかりません。');
            break;
          }
          case 'tree': {
            const name=args.find(x=>!x.startsWith('/'))||'.';const dir=parsePathInput(name);
            if(!dir||!existingDir(dir)){writeTerminalLine('フォルダが存在しません: '+name);break;}
            writeTerminalLine(drawTree(dir,args.some(x=>x.toLowerCase()==='/f'),args.some(x=>x.toLowerCase()==='/a')));break;
          }

          case 'type': {
            for(const name of args){
              const path=parsePathInput(name);
              if(!path||!getFile(path))writeTerminalLine('ファイルが見つかりません: '+name);
              else writeTerminalLine(fileContent(path));
            }
            break;
          }
          case 'ping': {
            let count=4, host='', timeout=4000, bad=false;
            for(let i=0;i<args.length;i++){
              const a=args[i].toLowerCase();
              if(a==='-n' && args[i+1])count=Number(args[++i]);
              else if(a==='-w' && args[i+1])timeout=Number(args[++i]);
              else if(a.startsWith('-'))bad=true;
              else if(!host)host=args[i];else bad=true;
            }
            if(bad||!host||!Number.isInteger(count)||count<1||count>10||!Number.isInteger(timeout)||timeout<1){
              writeTerminalLine('構文: ping [-n 1..10] [-w ミリ秒] host（-t 等は未対応）');break;
            }
            const h=host.toLowerCase();
            const scenarios={'127.0.0.1':'success','127.0.0.2':'timeout','127.0.0.3':'unreachable','127.0.0.4':'partial','127.0.0.5':'general'};
            if(h==='nonexistent.invalid' || h.endsWith('.invalid')){
              writeTerminalLine(`【疑似通信】Ping 要求ではホスト ${host} が見つかりませんでした。ホスト名を確認してもう一度実行してください。`);
              break;
            }
            const scenario=scenarios[h] || 'success';
            const ip=h==='localhost'?'127.0.0.1':(/^(?:\d{1,3}\.){3}\d{1,3}$/.test(h)?host:'192.0.2.1');
            writeTerminalLine(`【疑似通信：学習用シナリオ】 ${host} [${ip}] に ping を送信しています（32 バイトのデータ）:`);
            let received=0, unreachable=0;
            for(let i=0;i<count;i++){
              const status=scenario==='partial'?(i%2===0?'success':'timeout'):scenario;
              if(status==='success'){
                received++;
                writeTerminalLine(`${ip} からの応答: バイト数=32 時間<1ms TTL=128`);
              }else if(status==='timeout'){
                writeTerminalLine('要求がタイムアウトしました。');
              }else if(status==='unreachable'){
                unreachable++;
                writeTerminalLine('192.0.2.1 からの応答: 宛先ホストに到達できません。');
              }else{
                writeTerminalLine('PING: 転送に失敗しました。一般エラー。');
              }
            }
            // 到達不能はICMPエラー応答であり、正常なEcho応答ではない。
            // Windowsが表示する統計との差異を避け、学習用のEcho成功数として集計する。
            const lost=count-received;
            writeTerminalLine(`${ip} の ping 統計（学習用・Echo応答基準）: 送信 = ${count}, 受信 = ${received}, 損失 = ${lost} (${Math.round(100*lost/count)}% の損失)`);
            if(unreachable)writeTerminalLine('補足：到達不能のICMPエラー応答はEcho成功として集計していません。');
            break;
          }
          case 'ipconfig': {
            const option=args[0]?.toLowerCase();
            if(option && option!=='/all'){writeTerminalLine(`${option} はプレイグラウンド未対応です。`);break;}
            writeTerminalLine('【疑似設定：実際の端末情報ではありません】\nWindows IP 構成\n\nイーサネット アダプター Ethernet:\n   IPv4 アドレス . . . . . : 192.0.2.10\n   サブネット マスク . . . : 255.255.255.0\n   デフォルト ゲートウェイ : 192.0.2.1'+(option==='/all'?'\n   物理アドレス . . . . . : 02-00-00-00-00-01\n   DNS サーバー . . . . . : 192.0.2.53':''));
            break;
          }
          case 'nslookup': {
            if(args.length!==1 || args[0].startsWith('-')){writeTerminalLine('DNSサーバー指定や -type オプションは未対応です。');break;}
            const host=args[0];
            const address=/^localhost$/i.test(host)?'127.0.0.1':'192.0.2.20';
            writeTerminalLine(`【疑似DNS応答】\nサーバー:  example-dns\nAddress: 192.0.2.53\n\n名前:    ${host}\nAddress: ${address}`);
            break;
          }
          case 'echo': {
            const message = args.includes('--help') ? 'echo [message]' : args.join(' ');
            writeTerminalLine(message);
            break;
          }

          case 'cls': {
            terminalOutputEl.innerHTML = '';
            break;
          }

          case 'help': {
            const target = args[0];
            if (target && commandExists(commandAliases[target.toLowerCase()] || target.toLowerCase())) {
              const detail = commandCatalog[commandAliases[target.toLowerCase()] || target.toLowerCase()];
              writeTerminalLine(`${detail.name} : ${detail.summary}`);
              writeTerminalLine(`構文: ${detail.syntax}`);
            } else {
              writeTerminalLine('利用可能なコマンド: mkdir/md, dir, cd/chdir, del/erase, rmdir/rd, copy, xcopy, robocopy, move, ren/rename, tree, find, findstr, where, echo, type, ping, ipconfig, nslookup, cls, help, C:, D:');
            }
            break;
          }

          default:
            writeTerminalLine(`未実装のコマンド: ${command}`);
        }
      }

      // 入力履歴はページ内のみで保持。詳細ページの切り替え・リセット時に破棄する。
      const inputHistory = [];
      let historyCursor = 0;
      let historyDraft = '';
      let completion = null;

      function resetInputNavigation(clearHistory = false) {
        completion = null;
        historyCursor = inputHistory.length;
        historyDraft = '';
        if (clearHistory) {
          inputHistory.length = 0;
          historyCursor = 0;
        }
      }

      // 引用符を含む最後の引数を対象とし、途中のディレクトリ名も補完する。
      function getCompletionContext(input) {
        const leading = input.match(/^\s*/)[0];
        const body = input.slice(leading.length);
        if (!body) return {prefix: leading, token: '', kind: 'command', command: ''};
        const commandMatch = body.match(/^([^\s]+)(\s+)?/);
        const cmd = commandMatch[1].toLowerCase();
        if (!commandMatch[2]) return {prefix: leading, token: commandMatch[1], kind: 'command', command: ''};
        // 正規表現で末尾の非引用トークン／引用トークンを取り出す。
        const tail = body.slice(commandMatch[0].length);
        let quoted = false, start = 0;
        for (let i = 0; i < tail.length; i++) {
          if (tail[i] === '"') quoted = !quoted;
          else if (/\s/.test(tail[i]) && !quoted) start = i + 1;
        }
        const rawToken = tail.slice(start);
        const prefix = leading + commandMatch[0] + tail.slice(0, start);
        return {prefix, token: rawToken, kind: 'path', command: commandAliases[cmd] || cmd};
      }

      function completionCandidates(input) {
        const ctx = getCompletionContext(input);
        if (ctx.kind === 'command') {
          const names = [...Object.keys(commandCatalog).filter(k => !['redirect','pipe'].includes(k)),
            ...Object.keys(commandAliases), 'C:', 'D:'];
          return [...new Set(names)].filter(x => x.toLowerCase().startsWith(ctx.token.toLowerCase()))
            .sort((a,b)=>a.localeCompare(b, 'en')).map(x => ctx.prefix + x);
        }
        const commandsWithPaths = new Set(['cd','mkdir','dir','type','copy','xcopy','robocopy',
          'move','ren','del','rmdir','find','findstr','where','tree']);
        if (!commandsWithPaths.has(ctx.command)) return [];
        const token = ctx.token.replace(/^"/, '');
        if (token.startsWith('/') || token.startsWith('-') || token.includes('*') || token.includes('?')) return [];
        const normalized = normalizeSlashes(token);
        const lastSep = normalized.lastIndexOf('\\');
        const folderPrefix = lastSep >= 0 ? normalized.slice(0,lastSep+1) : '';
        const part = lastSep >= 0 ? normalized.slice(lastSep+1) : normalized;
        // "D:" / "C:" は各ドライブの最後のカレントディレクトリを参照。
        const pathFolder = parsePathInput(folderPrefix || '.');
        const folder = pathFolder ? existingDir(pathFolder) : null;
        if (!folder) return [];
        const folderOnly = ['cd','rmdir','tree'].includes(ctx.command);
        const items = (state.fs[folder] || []).filter(name => {
          const path = joinPath(folder,name);
          return name.toLowerCase().startsWith(part.toLowerCase()) && (!folderOnly || !!existingDir(path));
        }).sort((a,b)=>a.localeCompare(b,'ja',{numeric:true}));
        return items.map(name => {
          const pathToken = folderPrefix + name;
          const needsQuotes = /\s/.test(pathToken) || ctx.token.startsWith('"');
          return ctx.prefix + (needsQuotes ? '"' + pathToken + '"' : pathToken);
        });
      }

      terminalInputEl.addEventListener('keydown', event => {
        if (event.isComposing || event.keyCode === 229) return;
        if (event.key === 'ArrowUp' || event.key === 'ArrowDown') {
          if (!inputHistory.length) return;
          event.preventDefault();
          completion = null;
          if (event.key === 'ArrowUp') {
            if (historyCursor === inputHistory.length) historyDraft = terminalInputEl.value;
            historyCursor = Math.max(0, historyCursor - 1);
          } else {
            historyCursor = Math.min(inputHistory.length, historyCursor + 1);
          }
          terminalInputEl.value = historyCursor === inputHistory.length ? historyDraft : inputHistory[historyCursor];
          terminalInputEl.setSelectionRange(terminalInputEl.value.length,terminalInputEl.value.length);
          return;
        }
        if (event.key === 'Tab') {
          event.preventDefault();
          if (!completion || !completion.variants.includes(terminalInputEl.value)) {
            const variants = completionCandidates(terminalInputEl.value);
            if (!variants.length) return;
            completion = {variants, index: event.shiftKey ? variants.length - 1 : 0};
          } else {
            completion.index = (completion.index + (event.shiftKey ? -1 : 1) + completion.variants.length) % completion.variants.length;
          }
          terminalInputEl.value = completion.variants[completion.index];
          terminalInputEl.setSelectionRange(terminalInputEl.value.length,terminalInputEl.value.length);
        }
      });
      terminalInputEl.addEventListener('input', () => { completion = null; });

      document.getElementById('resetButton').addEventListener('click', () => {
        Object.assign(state, initialState());
        resetInputNavigation(true);
        terminalOutputEl.innerHTML = '';
        terminalInputEl.value = '';
        renderExplorer();
        writeTerminalLine('Windows CMD シミュレータをリセットしました。');
        writeTerminalLine(`${state.currentPath}>`);
      });

      terminalFormEl.addEventListener('submit', (event) => {
        event.preventDefault();
        const input = terminalInputEl.value.trim();
        if (!input) return;

        inputHistory.push(input);
        resetInputNavigation();
        writeTerminalLine(`${state.currentPath}> ${input}`);
        executeShellLine(input);
        writeTerminalLine(`${state.currentPath}>`);
        terminalInputEl.value = '';
      });

      function init() {
        initCommandList();
        renderCommandDetail('mkdir');
        renderExplorer();
        writeTerminalLine('Windows CMD シミュレータを起動しました。');
        writeTerminalLine('例: echo Hello > hello.txt / type hello.txt | find \"Hello\" / ping localhost / find "ERROR" notes.txt / findstr /s "INFO" *.txt / where /r C:\\WORK *.txt');
        writeTerminalLine('');
        writeTerminalLine(`${state.currentPath}>`);
      }

      init();
    </script>
  </body>
</html>
